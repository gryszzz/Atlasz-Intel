name: YSZ Meridian Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Desktop/web build
        run: npm run build

      - name: GitHub Pages web build
        env:
          VITE_BASE_PATH: /Atlasz-Intel/
        run: npm run web:build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Diff hygiene
        run: git diff --check

      - name: Runtime config
        run: npx tsx scripts/checkRuntimeConfig.mts

      - name: Runtime verification
        run: npx tsx scripts/runtimeVerification.mts
