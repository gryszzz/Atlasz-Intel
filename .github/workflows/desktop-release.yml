name: Build YSZ Meridian Desktop

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub prerelease after successful packaging
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to use when publishing
        required: true
        default: meridian-preview
        type: string

permissions:
  contents: write

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build

      - name: Package Meridian for macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Collect package
        shell: bash
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" \) -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -maxdepth 1 -print -quit)"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: YSZ-Meridian-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease assets
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --target "${GITHUB_SHA}"               --title "YSZ Meridian Preview"               --notes "Preview desktop build of YSZ Meridian. Unsigned macOS package; verify provenance from this repository before opening."               --prerelease
          fi

          gh release upload "$RELEASE_TAG" artifacts/* --clobber
