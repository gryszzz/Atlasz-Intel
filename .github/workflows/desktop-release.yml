name: Publish YSZ Meridian Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - src/**
      - public/**
      - build/**
      - .github/workflows/desktop-release.yml

permissions:
  contents: write

concurrency:
  group: meridian-desktop-release
  cancel-in-progress: true

env:
  RELEASE_TAG: meridian-preview

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Normalize filenames
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cp "$(find release -maxdepth 1 -type f -name '*.dmg' | head -1)" "artifacts/YSZ-Meridian-macOS-Apple-Silicon.dmg"
            cp "$(find release -maxdepth 1 -type f -name '*.zip' | head -1)" "artifacts/YSZ-Meridian-macOS-Apple-Silicon.zip"
          else
            cp "$(find release -maxdepth 1 -type f -name '*.dmg' | head -1)" "artifacts/YSZ-Meridian-macOS-Intel.dmg"
            cp "$(find release -maxdepth 1 -type f -name '*.zip' | head -1)" "artifacts/YSZ-Meridian-macOS-Intel.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: YSZ-Meridian-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Normalize filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem release -File | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer produced." }
          Copy-Item $installer.FullName "artifacts/YSZ-Meridian-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: YSZ-Meridian-Windows-x64
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Normalize filename
        shell: bash
        run: |
          mkdir -p artifacts
          cp "$(find release -maxdepth 1 -type f -name '*.AppImage' | head -1)" "artifacts/YSZ-Meridian-Linux-x64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: YSZ-Meridian-Linux-x64
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish one-click download
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: YSZ-Meridian-*
          path: release-assets
          merge-multiple: true

      - name: Create or update Meridian Preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "YSZ Meridian Preview"               --notes "Latest cross-platform preview of YSZ Meridian. macOS builds are unsigned until Developer ID signing/notarization is configured."               --prerelease
          fi

          gh release edit "$RELEASE_TAG"             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "YSZ Meridian Preview"

          gh release upload "$RELEASE_TAG" release-assets/*             --repo "${GITHUB_REPOSITORY}"             --clobber
